res20:
  _text: 'MultiPL-E chat 判分曾把 Markdown 代码围栏当语法错误：旧 `strip_fences` 只在围栏闭合时才剥离，而数据集停止串 `

    }` 通常把完成物切在闭合围栏之前，于是整格失败。用磁盘完成物（同一份生成、只补上正确后处理）重算：Qwen3.8-27B cpp chat Q2 0.2174→0.6335、Q3 0.4845→0.8571；py 仅 +0.0435/+0.0497。gemma-4-26B 的完成物无围栏，其 cpp 0.8323 不变。Q3 那一对是重判值、不是该格的当前值：q38-27b-q3 cpp chat 现入库值是 0.8696 = 140/161（res24），0.8571 只是对旧落盘完成物的重判，重判与重跑之差见 plan15。'
  from: result.res16, result.res18
  author: measurement
  origin: .wrapup/mres/m26-*_fixed.jsonl（由 m26 原始样本经修正后处理生成）
  scope: general
  status: current
  evidence: 'm26-q38-27b-q3-cpp: 72/161 围栏且 72/161 失败；重算 pass 78→138'
  producer: '`python3 .wrapup/mpl_run.py eval --lang cpp --samples <cell>_fixed.jsonl`，其中 `_fixed.jsonl` 由 mpl_run.strip_fences 处理原始样本得到'
  domain:
    kind: measured
res21:
  _text: '旧 `strip_fences` 开头 `text.strip()` 确实会抹掉无围栏完成物的首行缩进（m48 已改为只剥行首围栏），但「因此造成 gemma-4-26B-A4B py 那些 `Exception`」这一因果从句撤回：落盘完成物普遍带「函数体首行在第 0 列」的签名——m26 的 g26b-q2-py 160/161、g26b-q3-py 161/161，对照格 q38-27b-q3-py 13/161；而 m161 是在修正后的 harness 下落盘的，同一签名仍在（g26b-q2-py 159/161、g26b-q3-py 160/161 首行列 0），`strip_fences` 对无围栏完成物只做 `rstrip`、不动缩进。所以这个签名不是后处理造成的证据，成因以 res24 的模型行为为准。仍然为真的另一半：m26 落盘的 py 完成物用修正后处理重判仍是 `pass: 0`，这些格靠重判救不回来；res17 的「整轮运行失败」也仍然是错的归因。'
  from: result.res17, result.res20, result.res24
  author: measurement
  origin: .wrapup/mres/m26-g26b-q*-py.jsonl 与 .wrapup/mres/m161-g26b-q*-py-chat.jsonl 的首行缩进；两份 m26 `_fixed_eval.json` 的重判结果
  scope: general
  status: current
  evidence: 首行列 0 的完成物计数：m26 g26b-q2-py 160/161、g26b-q3-py 161/161、对照 q38-27b-q3-py 13/161；m161（修正后处理）g26b-q2-py 159/161、g26b-q3-py 160/161；m26 落盘 py 完成物用修正后处理重判 .wrapup/mres/m26-g26b-q2-py_fixed_eval.json 与 .wrapup/mres/m26-g26b-q3-py_fixed_eval.json 的 `pass` 均为 0（n=161）
  producer: 每格首行列 0 条数 `jq -r '.completion|split("\n")[0]' <samples.jsonl> | grep -c '^[^[:space:]]'`；重判值 `jq .pass .wrapup/mres/m26-g26b-q2-py_fixed_eval.json`（q3 同）
  domain:
    kind: measured
