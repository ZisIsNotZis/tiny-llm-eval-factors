res17b:
  _text: （撤回 res17 的两半归因）res17 把那些全 `Exception` 的格判为「整轮运行报错」，该归因已撤回；m160 追查时给出的替代归因「旧 `strip_fences` 的 `text.strip()` 破坏首行缩进」同样撤回——同一「函数体首行在第 0 列」的签名在修正后的 harness 下依然存在（gemma-4-26B-A4B py chat 仍 159/161、160/161 为 `Exception`），可见修 harness 既没有、也不可能救回那些格；成因现在归到模型行为（res24）。「却被写成 0、必须记缺失」这一半仍然成立：这类格记 NULL，不写 0。
  from: result.res17, result.res24
