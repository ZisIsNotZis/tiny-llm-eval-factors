m39:
  _text: "绝不用标称标签（`Q2`/`Q3` 等）当量化横轴：同名标签在不同模型上实际跨度 2.76–5.04 比特/权重，会让不同家族不可比；凡横轴是量化处一律用有效位宽、保留两位小数。"
  author: user
