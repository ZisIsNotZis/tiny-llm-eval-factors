m35:
  _text: "备份与入库规则：任何改动前先做编号备份 `experiments.sqlite.bakN`；每次入库只跑一次 `migrate_db.py` 并校验「总行数 == distinct 行数」；确需重复入库时先把逐语言入库改成 `DELETE … WHERE run_tag=?` 再插（`ingest_m22` 已是此模式）。"
