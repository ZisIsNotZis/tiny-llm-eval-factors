m40:
  _text: "模型文件命名 = `家族-版本[-类型]-<量化后缀>.gguf`；家族（family）= 去掉量化后缀后的名字，同一个家族 = 同一套 base 权重，这是家族内对照的基础。"
  author: agent
  origin: ".scratch/originals/NAMING.md 模型文件命名与家族"
  scope: general
  status: current
  domain:
