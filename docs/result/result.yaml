  author: measurement
  origin: ".scratch/originals/L2-结果.md 采样/解码参数"
  scope: general
  status: current
  domain:
    kind: measured
res11:
  _text: "投机解码：草稿深度越大速度越快（0.8B 约 +36%、9B 约 +93%）；分数随深度几乎不变，MMLU 在每个深度逐位相同。"
  author: measurement
  origin: ".scratch/originals/L2-结果.md 思考开关/投机解码"
  scope: general
  status: current
  domain:
    kind: measured
res12:
  _text: "QAT：同标称配方下文件小 0.36–0.95 比特/权重；所有 4-bit 档配对里 QAT 与原生在多数基准测不出差异，12B 配对的 MMLU 例外——差值 −0.197（95% CI [−0.242, −0.153]，显著为负），且该原生档位本身存疑；低位宽（约 2-bit）档配对里 QAT 明显更低。"
  author: measurement
  origin: ".scratch/originals/L2-结果.md 量化感知训练（QAT）"
  scope: general
  status: current
  domain:
    kind: measured
