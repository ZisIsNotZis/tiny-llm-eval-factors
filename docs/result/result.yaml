res20:
  _text: "MultiPL-E chat 判分曾把 Markdown 代码围栏当语法错误：旧 `strip_fences` 只在围栏闭合时才剥离，而数据集停止串 `\n}` 通常把完成物切在闭合围栏之前，于是整格失败。用磁盘完成物（同一份生成、只补上正确后处理）重算：Qwen3.8-27B cpp chat Q2 0.2174→0.6335、Q3 0.4845→0.8571；py 仅 +0.0435/+0.0497。gemma-4-26B 的完成物无围栏，其 cpp 0.8323 不变。"
