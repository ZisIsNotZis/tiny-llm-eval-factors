an1:
  _text: "量化位宽该选多大，取决于该家族自己的曲线拐点：多数家族的主要抬升出现在有效位宽约 4–5 比特/权重之间，granite-4.1-3b 更早（3.22→0.048、4.06→0.391）；应选「分数曲线开始走平」的位宽，没有统一的某档结论。"
  from: "result.res1, result.res5"
  author: agent
  origin: ".scratch/originals/L3-分析.md 1"
  scope: general
  status: provisional
  domain:
    kind: analysis
an2:
  _text: "判断量化够不够，看代码 / 推理 / 指令，不要看知识类基准：知识（MMLU）与事实性（TruthfulQA）在很宽的位宽范围内几乎不动，用它们判断会低估损失。"
  from: "result.res2, result.res3"
  author: agent
  origin: ".scratch/originals/L3-分析.md 2"
  scope: general
  status: provisional
  domain:
    kind: analysis
an3:
  _text: "小模型做困难、多步任务需要更多位宽：2B 在低比特时困难 agentic 任务整体触底。"
  from: "result.res1"
  author: agent
  origin: ".scratch/originals/L3-分析.md 3"
  scope: general
  status: provisional
  domain:
    kind: analysis
an4:
  _text: "同文件大小下，比较「方案/字节」比「厂商标签」更重要：IQ 系列与 K 系列有可测差异，厂商标签测不出差异。"
  from: "result.res7"
  author: agent
  origin: ".scratch/originals/L3-分析.md 4"
  scope: general
  status: provisional
  domain:
    kind: analysis
an5:
